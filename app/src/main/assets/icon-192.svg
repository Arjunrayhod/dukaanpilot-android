<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Store Roof Awning -->
  <path d="M 44 76 L 96 46 L 148 76 L 148 86 L 44 86 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Store Body -->
  <path d="M 52 86 L 140 86 L 140 144 C 140 148 136 152 132 152 L 60 152 C 56 152 52 148 52 144 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

  <!-- Shop Door / Checkout Counter -->
  <path d="M 80 152 L 80 110 C 80 106 84 102 88 102 L 104 102 C 108 102 112 106 112 110 L 112 152 Z" fill="rgba(255,255,255,0.1)"/>

  <!-- AI Pulse / Lightning Badge -->
  <circle cx="134" cy="58" r="18" fill="#10b981" filter="url(#glow)"/>
  <path d="M 134 47 L 126 59 L 133 59 L 131 69 L 141 57 L 134 57 Z" fill="#ffffff"/>

  <!-- Currency / POS Symbol -->
  <text x="96" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">₹</text>
</svg>
