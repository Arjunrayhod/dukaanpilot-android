<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="primaryGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Store Roof Awning -->
  <path d="M 118 202 L 256 122 L 394 202 L 394 230 L 118 230 Z" fill="url(#primaryGrad512)" filter="url(#glow512)"/>
  
  <!-- Store Body -->
  <path d="M 138 230 L 374 230 L 374 384 C 374 395 363 406 352 406 L 160 406 C 149 406 138 395 138 384 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Shop Door / Checkout Counter -->
  <path d="M 214 406 L 214 294 C 214 283 224 274 235 274 L 277 274 C 288 274 298 283 298 294 L 298 406 Z" fill="rgba(255,255,255,0.1)"/>

  <!-- AI Pulse / Lightning Badge -->
  <circle cx="360" cy="154" r="48" fill="#10b981" filter="url(#glow512)"/>
  <path d="M 360 124 L 338 156 L 357 156 L 352 184 L 379 152 L 360 152 Z" fill="#ffffff"/>

  <!-- Currency / POS Symbol -->
  <text x="256" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#38bdf8" text-anchor="middle">₹</text>
</svg>
